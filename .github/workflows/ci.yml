name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Сборка и тестирование C++ проекта
  # ─────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-cmake

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake python3-pip
          pip install --break-system-packages conan
          conan profile detect

      - name: Configure and build
        run: |
          conan install . --output-folder=build --build=missing -s build_type=Release
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Check binary exists
        run: test -f build/file_analyzer

      - name: Smoke test
        run: ./build/file_analyzer .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: file_analyzer-binary
          path: build/file_analyzer

  # ─────────────────────────────────────────────
  # JOB 2: Линтинг Dockerfile — best practices
  # ─────────────────────────────────────────────
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # ─────────────────────────────────────────────
  # JOB 3: Секреты в коде — не пускаем дальше, если найдены
  # ─────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 4: Сборка и проверка Docker-образа
  # ─────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [ build-and-test, lint-dockerfile, gitleaks ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t file-analyzer:${{ github.sha }} .

      - name: Smoke test Docker image
        run: docker run --rm file-analyzer:${{ github.sha }} . || true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: file-analyzer:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '0'

  # ═══════════════════════════════════════════════════════════
  # JOB 5: DEPLOY
  # ═══════════════════════════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag image
        run: |
          IMAGE=ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/file-analyzer
          docker build -t $IMAGE:${{ github.sha }} .
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest

      - name: Push image to registry
        run: |
          IMAGE=ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/file-analyzer
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deployment summary
        run: |
          echo "✅ Deployed: ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/file-analyzer:${{ github.sha }}"