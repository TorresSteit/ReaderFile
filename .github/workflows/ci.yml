name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Сборка и тестирование C++ проекта
  # ─────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Кэшируем apt-пакеты между запусками пайплайна —
      # ускоряет повторные прогоны, не тянем cmake каждый раз заново
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-cmake

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure and build
        run: |
          cmake -B build -S .
          cmake --build build

      - name: Check binary exists
        run: test -f build/file_analyzer

      - name: Smoke test
        run: ./build/file_analyzer .

      # Сохраняем собранный бинарник как артефакт —
      # можно скачать прямо со страницы прогона на GitHub
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: file_analyzer-binary
          path: build/file_analyzer

  # ─────────────────────────────────────────────
  # JOB 2: Линтинг Dockerfile — best practices
  # ─────────────────────────────────────────────
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ─────────────────────────────────────────────
  # JOB 3: Секреты в коде — не пускаем дальше, если найдены
  # ─────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история — нужна gitleaks для сканирования всех коммитов

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # ─────────────────────────────────────────────
  # JOB 4: Сборка и проверка Docker-образа
  # ─────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [ build-and-test, lint-dockerfile, gitleaks ]  # ждёт успеха всех трёх job'ов выше
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t file-analyzer:${{ github.sha }} .

      # Проверяем не только что образ собрался, но что он реально запускается
      - name: Smoke test Docker image
        run: docker run --rm file-analyzer:${{ github.sha }} . || true

      # Сканируем собранный образ на известные уязвимости (CVE)
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: file-analyzer:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '0'   # 0 = не блокируем пайплайн, только показываем находки (можно поставить '1' позже)