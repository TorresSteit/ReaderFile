name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Сборка и тестирование C++ проекта
  # ─────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-cmake

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure and build
        run: |
          cmake -B build -S .
          cmake --build build

      - name: Check binary exists
        run: test -f build/file_analyzer

      - name: Smoke test
        run: ./build/file_analyzer .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: file_analyzer-binary
          path: build/file_analyzer

  # ─────────────────────────────────────────────
  # JOB 2: Линтинг Dockerfile — best practices
  # ─────────────────────────────────────────────
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error   # warning'и (DL3008 и т.п.) не блокируют пайплайн, только error

  # ─────────────────────────────────────────────
  # JOB 3: Секреты в коде — не пускаем дальше, если найдены
  # ─────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # ─────────────────────────────────────────────
  # JOB 4: Сборка и проверка Docker-образа
  # ─────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [ build-and-test, lint-dockerfile, gitleaks ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t file-analyzer:${{ github.sha }} .

      - name: Smoke test Docker image
        run: docker run --rm file-analyzer:${{ github.sha }} . || true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: file-analyzer:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '0'

   

  # ═══════════════════════════════════════════════════════════
  # JOB 5: DEPLOY
  # ═══════════════════════════════════════════════════════════
  # RU: Публикуем собранный и проверенный Docker-образ в GitHub
  #     Container Registry (ghcr.io). Финальный шаг — запускается
  #     только после успешной сборки, линтинга, проверки секретов
  #     и security-скана образа.
  # EN: Publishes the built and verified Docker image to the
  #     GitHub Container Registry (ghcr.io). The final stage —
  #     runs only after build, lint, secret scanning, and the
  #     image security scan have all succeeded.
  # ═══════════════════════════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    # RU: Деплоим только из master — feature-ветки и PR не публикуют образы.
    # EN: Deploy only from master — feature branches and PRs never publish images.
    if: github.ref == 'refs/heads/master'

    # RU: Явно запрашиваем право на запись в GitHub Packages.
    # EN: Explicitly request write access to GitHub Packages.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # RU: Авторизация в registry — GITHUB_TOKEN создаётся автоматически.
      # EN: Registry authentication — GITHUB_TOKEN is generated automatically.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RU: Собираем образ, тегируем хэшем коммита и latest.
      # EN: Build the image, tag it with the commit SHA and latest.
      - name: Build and tag image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/file-analyzer
          docker build -t $IMAGE:${{ github.sha }} .
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest

      # RU: Публикуем оба тега в registry.
      # EN: Push both tags to the registry.
      - name: Push image to registry
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/file-analyzer
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deployment summary
        run: |
          echo "✅ Deployed: ghcr.io/${{ github.repository_owner }}/file-analyzer:${{ github.sha }}"
          echo "✅ Also tagged as: ghcr.io/${{ github.repository_owner }}/file-analyzer:latest"лько показываем находки (можно поставить '1' позже)