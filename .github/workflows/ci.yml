stages:
  - build
  - test
  - security
  - sonarqube-check
  - docker
  - image-scan

variables:
  BUILD_DIR: "build"
  IMAGE_NAME: "file-analyzer"
  GIT_DEPTH: "0"

build:
  stage: build
  image: gcc:13
  before_script:
    - apt-get update && apt-get install -y cmake
  script:
    - cmake -B $BUILD_DIR -S .
    - cmake --build $BUILD_DIR
  artifacts:
    paths:
      - $BUILD_DIR/
    expire_in: 1 hour

test:
  stage: test
  image: gcc:13
  dependencies:
    - build
  script:
    - test -f $BUILD_DIR/file_analyzer
    - ./$BUILD_DIR/file_analyzer .

# ─────────────────────────────────────────────
# STAGE: Gitleaks — сканирует git-историю и код на предмет
# случайно закоммиченных секретов (пароли, API-ключи, токены)
# ─────────────────────────────────────────────
gitleaks:
  stage: security
  image: zricethezav/gitleaks:latest   # официальный образ gitleaks
  script:
    # --source=. сканирует текущий репозиторий
    # -v = verbose, --exit-code 1 = упасть с ошибкой, если найдены секреты
    - gitleaks detect --source=. -v --exit-code 1
  allow_failure: false   # намеренно НЕ разрешаем провал — утечка секрета критична, пайплайн должен остановиться

sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.sources=.
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
  allow_failure: true

docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    # Сохраняем образ как artifact (tar), чтобы следующая job (Trivy) могла его просканировать,
    # не пересобирая заново
    - docker save $IMAGE_NAME:$CI_COMMIT_SHORT_SHA -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  only:
    - main

# ─────────────────────────────────────────────
# STAGE: Trivy — сканирует Docker-образ на известные уязвимости
# (CVE) в системных пакетах и зависимостях внутри образа
# ─────────────────────────────────────────────
trivy-scan:
  stage: image-scan
  image: aquasec/trivy:latest   # официальный образ Trivy
  dependencies:
    - docker-build
  script:
    # Загружаем сохранённый образ из предыдущего job'а
    - docker load -i image.tar || true
    # --severity CRITICAL,HIGH = показывать только опасные находки, не заваливать шумом
    # --exit-code 1 = упасть, если найдены уязвимости этого уровня
    # --no-progress = чище лог для CI
    - trivy image --severity CRITICAL,HIGH --exit-code 1 --no-progress $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  allow_failure: true   # на старте проекта часто ставят true, чтобы сначала посмотреть на находки,
  # а потом ужесточать до false
  only:
    - main